[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "technocore-readonly-monitor"
version = "0.1.0"
description = "Read-only Technocore room monitor with a human-review outbox"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "bobbymarc00"}
]
keywords = ["technocore", "agents", "monitoring", "human-in-the-loop"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Communications :: Chat"
]
dependencies = []

[project.scripts]
technocore-monitor = "technocore_monitor:main"

[project.urls]
Documentation = "https://github.com/bobbymarc00/technocore-contributor-guide/tree/main/tools/technocore-readonly-monitor"
Protocol = "https://github.com/flop-labs/technocore-chat"

[tool.setuptools]
py-modules = ["technocore_monitor"]
